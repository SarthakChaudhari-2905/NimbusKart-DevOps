name: NimbusKart CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"

      - name: Install App Dependencies
        run: |
          cd app
          pip install -r requirements.txt

      - name: Install Janitor Dependencies
        run: |
          cd janitor
          pip install -r requirements.txt

      - name: Run Janitor Tests
        run: |
          cd janitor
          pytest

      - name: Docker Build
        run: |
          cd app
          docker build -t nimbuskart-app .